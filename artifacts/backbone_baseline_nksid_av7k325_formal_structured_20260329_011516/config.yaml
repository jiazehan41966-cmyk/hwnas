project:
  name: backbone-baseline-nksid-av7k325
  seed: 42
  output_dir: results
  run_name: null
dataset:
  name: nksid
  data_dir: data/NKSID
  input_channels: 1
  image_size: 224
  num_classes: 8
  fold: 0
  num_workers: 0
  use_kfold: true
  valid_size: null
  split_seed: 42
hardware:
  board: alinx_av7k325
  clock_mhz: 200
  quantization_bits: 8
  cpu_latency_warmup: 10
  cpu_latency_runs: 30
constraints:
  max_latency_ms: 50.0
  max_energy_mj: null
  max_model_size_mb: null
  max_dsp: 500
  max_bram: 1800
  max_lut: 100000
  max_power_w: 20.0
  max_memory_bandwidth_gbps: 3.0
  max_offchip_mem_mb: 128.0
training:
  optimizer: adamw
  batch_size: 64
  epochs: 240
  lr: 0.001
  min_lr: 1.0e-05
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stopping_patience: 20
  dropout: 0.2
baseline:
  strict_pretrained: false
  topk_accuracy: 5
  selection_metric: macro_f1
  pool_selection:
    export_selected_pool: true
    search_anchor_families:
    - mobilenet_v2
    - fbnet_like
    - shufflenet_v2
    prefer_pretrained_for_search_anchor: true
    lightweight_metric: fpga_latency_ms
    lightweight_max_macro_drop: 0.1
    role_profile_map:
      search_anchor: mobile_anchor
      accuracy_anchor: accuracy_biased
      lightweight_anchor: lightweight_sonar
  candidates:
  - arch_id: simplecnn
    name: simplecnn
    display_name: SimpleCNN
    pretrained: false
  - arch_id: mobilenet_v2_pretrained
    name: mobilenet_v2
    display_name: MobileNetV2 (pretrained)
    pretrained: true
  - arch_id: mobilenet_v2_scratch
    name: mobilenet_v2
    display_name: MobileNetV2 (scratch)
    pretrained: false
  - arch_id: fbnet_like
    name: fbnet_like
    display_name: FBNet-like
    pretrained: false
  - arch_id: shufflenet_v2
    name: shufflenet_v2
    display_name: ShuffleNetV2
    pretrained: true
  - arch_id: efficientnet_b0
    name: efficientnet_b0
    display_name: EfficientNet-B0
    pretrained: true
