board_name: ALINX_AV7K325_100M
target_part: xc7k325t-ffg900-2

# Physical AV7K325 oscillator remains the 200 MHz differential clock. The
# harness generates a real 100 MHz user clock with MMCME2_BASE, so UART
# measurement latency is based on the actual clk_main frequency rather than a
# relaxed XDC-only assumption.
clock:
  port_name_p: sys_clk_p
  port_name_n: sys_clk_n
  input_period_ns: 5.0
  input_freq_hz: 200000000
  period_ns: 10.0
  freq_hz: 100000000
  package_pin_p: AE10
  package_pin_n: AF10
  iostandard: LVDS
  mmcm:
    enabled: true
    divclk_divide: 1
    clkfbout_mult_f: 5.0
    clkout0_divide_f: 10.0
    clkout0_phase: 0.0
    clkout0_duty_cycle: 0.5

reset:
  port_name: sys_rst_n
  active_low: true
  package_pin: AC21
  iostandard: LVCMOS33

uart:
  rx_port_name: uart_rx
  tx_port_name: uart_tx
  baud: 115200
  rx_package_pin: AA27
  package_pin: W28
  iostandard: LVCMOS33

status_led:
  port_name: status_led
  width: 2
  package_pins:
    - Y28
    - AA28
  iostandard: LVCMOS33

allow_unconstrained_io: false
