measurement_contract:
  contract_id: packed_stream_v1_phase0_v4_sonar_stage3_k3_pilot
  declaration: Isolated operator-level HLS/OOC low-DSP pilot for Phase0 v4 sonar stage3 k3 candidates. These rows are not canonical current84/arch84/full-network evidence and must not be merged into Phase0 v3 board results.
  io_style: packed_stream
  input_axis_rule: packed input channels * 8 bits
  output_axis_rule: packed output channels * 8 bits
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  pipeline_ii: 8
  input_parallelism: 1
  output_parallelism: 1
  unroll_factor: 1
  array_partition_factor: 1

clock_profiles:
  main_5ns:
    period_ns: 5.0
    target_clock_mhz: 200.0

implementation_profiles:
  baseline_pi1_po1_u1:
    input_parallelism: 1
    output_parallelism: 1
    unroll_factor: 1
    array_partition_factor: 1
    pipeline_ii: 8

representative_shapes:
  sonar_stage3_28_32_32_s1:
    feature_h: 28
    feature_w: 28
    in_channels: 32
    out_channels: 32
    stride: 1
    expand_ratio: 1
    op_spec:
      groups: 32
      target_clock_mhz: null

operators:
  denoise:
    enabled: true
    template: ../templates/denoise_serial_lowdsp_stage3_k3.cpp.tmpl
    top_function: denoise_kernel
    op_type: denoise
    shape_refs:
    - sonar_stage3_28_32_32_s1
    implementation_refs:
    - baseline_pi1_po1_u1
    clock_profile_refs:
    - main_5ns
    parameters:
      kernel_size: 3
      padding: 1
    op_spec_defaults:
      op: denoise
      expand_ratio: 1

  edge:
    enabled: true
    template: ../templates/edge_serial_lowdsp_stage3_k3.cpp.tmpl
    top_function: edge_kernel
    op_type: edge
    shape_refs:
    - sonar_stage3_28_32_32_s1
    implementation_refs:
    - baseline_pi1_po1_u1
    clock_profile_refs:
    - main_5ns
    parameters:
      kernel_size: 3
      padding: 1
    op_spec_defaults:
      op: edge
      expand_ratio: 1
