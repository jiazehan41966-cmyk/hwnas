measurement_contract:
  contract_id: packed_stream_v1_arch84_e2e_lowdsp_recovery
  declaration: Isolated low-DSP implementation recovery candidates for the arch_84 full-network harness. These rows are not current84/fullcombo/arch84 canonical latency evidence.
  io_style: packed_stream
  input_axis_rule: PACK_CH * bitwidth bits, pixel-major
  output_axis_rule: PACK_CH * bitwidth bits, pixel-major
  control_interface: AXI-Lite
  parameter_storage: deterministic_latency_only_bram
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  fixed_vector_params: 1
  max_axis_bits: 512
  pack_ch: 8
  ch_block: 8
  tile_order: pixel_major
  stream_order: pixel_major
  dsp_pack: '1'
  pipeline_ii: 2
  target_ii: 2
  input_parallelism: 1
  output_parallelism: 8
  unroll_factor: 1
  array_partition_factor: 8

