source:
  branch: detection_multiscale_v1
  backbone_search_space_source: configs/search/zcu104_mobilenetA_v2_rl_entropy_pareto_feasible_budget.yaml
  input_channels: 1
  image_size: 640
  num_classes: 3
  neck_head_stage1_searchable: false

feature_maps:
  p3:
    source_stage_index: 3
    feature_h: 80
    feature_w: 80
    stride: 8
    in_channels: 32
    neck_channels: 96
  p4:
    source_stage_index: 5
    feature_h: 40
    feature_w: 40
    stride: 16
    in_channels: 96
    neck_channels: 96
  p5:
    source_stage_index: 7
    feature_h: 20
    feature_w: 20
    stride: 32
    in_channels: 320
    neck_channels: 96

fixed_neck:
  type: fpn
  searchable: false
  lateral_ops:
    - {name: p3_lateral_1x1, feature_ref: p3, kernel_size: 1, in_channels: 32, out_channels: 96}
    - {name: p4_lateral_1x1, feature_ref: p4, kernel_size: 1, in_channels: 96, out_channels: 96}
    - {name: p5_lateral_1x1, feature_ref: p5, kernel_size: 1, in_channels: 320, out_channels: 96}
  top_down_ops:
    - {name: p4_to_p3_nearest_upsample_add, from: p4, to: p3}
    - {name: p5_to_p4_nearest_upsample_add, from: p5, to: p4}
  output_ops:
    - {name: p3_output_3x3, feature_ref: p3, kernel_size: 3, in_channels: 96, out_channels: 96}
    - {name: p4_output_3x3, feature_ref: p4, kernel_size: 3, in_channels: 96, out_channels: 96}
    - {name: p5_output_3x3, feature_ref: p5, kernel_size: 3, in_channels: 96, out_channels: 96}

fixed_head:
  type: dense_anchor_head
  searchable: false
  anchors_per_location: 3
  outputs_per_anchor: 8
  prediction_channels: 24
  tower_ops:
    - {name: p3_tower_3x3, feature_ref: p3, kernel_size: 3, in_channels: 96, out_channels: 96}
    - {name: p4_tower_3x3, feature_ref: p4, kernel_size: 3, in_channels: 96, out_channels: 96}
    - {name: p5_tower_3x3, feature_ref: p5, kernel_size: 3, in_channels: 96, out_channels: 96}
  prediction_ops:
    - {name: p3_pred_1x1, feature_ref: p3, kernel_size: 1, in_channels: 96, out_channels: 24}
    - {name: p4_pred_1x1, feature_ref: p4, kernel_size: 1, in_channels: 96, out_channels: 24}
    - {name: p5_pred_1x1, feature_ref: p5, kernel_size: 1, in_channels: 96, out_channels: 24}

claim_boundary:
  table_scope: feature-map shape and analytic cost scaffold
  hls_route_cost: not_established
  board_detection_accuracy: not_measured
  external_power: not_measured
