      kernel_size: 3
      padding: 1
      op: mbconv_e6_k3
      groups: 1
      expand_ratio: 6
    op_spec_defaults:
      op: mbconv_e6_k3
      groups: 1
      expand_ratio: 6

  mbconv_e6_k5:
    enabled: true
