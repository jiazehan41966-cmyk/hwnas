toolchain:
  part: xc7k325t-ffg676-2
  solution_name: solution1
  flow_target: vivado
  cpp_standard: c++14
  vitis_hls_bin: F:/vivado/Vitis_HLS/2023.2/bin/vitis_hls.bat
  vivado_bin: F:/vivado/Vivado/2023.2/bin/vivado.bat

workspace:
  project_root: ../results/strict40_expansion_p
  report_archive: ../results/strict40_expansion_r
  csv_path: ../results/strict40_expansion_hls.csv
  manifest_path: ../results/strict40_expansion_hls_manifest.yaml
  synthesis_summary_json: ../results/strict40_expansion_hls_synth_summary.json
  parse_summary_json: ../results/strict40_expansion_hls_parse_summary.json

measurement_contract:
  contract_id: packed_stream_v1
  declaration: Strict40 expansion full-block MBConv measurements for compact NAS.
  io_style: packed_stream
  input_axis_rule: packed input channels * 8 bits, segmented across multiple tokens if needed
  output_axis_rule: packed output channels * 8 bits, segmented across multiple tokens if needed
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  pipeline_ii: 1
  input_parallelism: 1
  output_parallelism: 1
  unroll_factor: 1
  array_partition_factor: 4
  max_axis_bits: 4096

clock_profiles:
  main_5ns:
    period_ns: 5.0
    target_clock_mhz: 200.0

implementation_profiles:
  baseline_pi1_po1_u1:
    input_parallelism: 1
    output_parallelism: 1
    unroll_factor: 1
    array_partition_factor: 4

representative_shapes:
  strict40_stage2_56_24_32_s2:
    feature_h: 56
    feature_w: 56
    in_channels: 24
    out_channels: 32
    stride: 2
  strict40_stage3_28_32_32_s1:
    feature_h: 28
    feature_w: 28
    in_channels: 32
    out_channels: 32
    stride: 1

operators:
  mbconv_e3_k3:
    enabled: true
    template: ../templates/mbconv.cpp.tmpl
    top_function: mbconv_e3_k3_kernel
    op_type: mbconv_e3_k3
    shape_refs:
      - strict40_stage2_56_24_32_s2
      - strict40_stage3_28_32_32_s1
    implementation_refs:
      - baseline_pi1_po1_u1
    clock_profile_refs:
      - main_5ns
    parameters:
      kernel_size: 3
      padding: 1
      op: mbconv_e3_k3
      groups: 1
      expand_ratio: 3
    op_spec_defaults:
      op: mbconv_e3_k3
      groups: 1
      expand_ratio: 3

  mbconv_e3_k5:
    enabled: true
    template: ../templates/mbconv.cpp.tmpl
    top_function: mbconv_e3_k5_kernel
    op_type: mbconv_e3_k5
    shape_refs:
      - strict40_stage2_56_24_32_s2
      - strict40_stage3_28_32_32_s1
    implementation_refs:
      - baseline_pi1_po1_u1
    clock_profile_refs:
      - main_5ns
    parameters:
      kernel_size: 5
      padding: 2
      op: mbconv_e3_k5
      groups: 1
      expand_ratio: 3
    op_spec_defaults:
      op: mbconv_e3_k5
      groups: 1
      expand_ratio: 3

  mbconv_e6_k3:
    enabled: true
    template: ../templates/mbconv.cpp.tmpl
    top_function: mbconv_e6_k3_kernel
    op_type: mbconv_e6_k3
    shape_refs:
      - strict40_stage3_28_32_32_s1
    implementation_refs:
      - baseline_pi1_po1_u1
