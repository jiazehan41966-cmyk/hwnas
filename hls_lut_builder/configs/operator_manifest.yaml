shape_export:
  backbone: mobilenet_v2
  input_channels: 1
  image_size: 224
  num_classes: 8

toolchain:
  part: xc7k325t-ffg676-2
  solution_name: solution1
  flow_target: vivado
  cpp_standard: c++14
  vitis_hls_bin: vitis_hls

workspace:
  project_root: ../results/p
  report_archive: ../results/r
  csv_path: ../results/hls.csv
  manifest_path: ../results/hls_manifest.yaml
  synthesis_summary_json: ../results/hls_synth_summary.json
  parse_summary_json: ../results/hls_parse_summary.json

measurement_contract:
  contract_id: packed_stream_v1
  declaration: LUT data is based on a packed-stream implementation; AXIS width equals packed channel block times 8 bits, using multiple tokens when a single channel vector would exceed the Vitis HLS AXI bitwidth limit.
  io_style: packed_stream
  input_axis_rule: packed input channels * 8 bits, segmented across multiple tokens if needed
  output_axis_rule: packed output channels * 8 bits, segmented across multiple tokens if needed
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  pipeline_ii: 1
  input_parallelism: 1
  output_parallelism: 1
  unroll_factor: 1
  array_partition_factor: 4

clock_profiles:
  main_5ns:
    period_ns: 5.0

implementation_profiles:
  baseline_pi1_po1_u1:
    input_parallelism: 1
    output_parallelism: 1
    unroll_factor: 1
    array_partition_factor: 4

operators:
  core:
    - stem_conv_k3_s2
    - dw_conv_k3
    - dw_conv_k5
    - pw_conv
    - mbconv_e3_k3
    - mbconv_e3_k5
    - mbconv_e6_k3
    - mbconv_e6_k5
    - skip
    - global_avg_pool
    - fc_layer
  extensions:
    - fused_mbconv_e3_k3
    - fused_mbconv_e6_k3
    - mixconv
    - denoise
    - edge
  excluded:
    - kernel_7x7_and_larger
    - se
    - swish_gelu
    - dilated_conv
  pilot:
    - stem_conv_k3_s2

search_policy:
  default_mainline_search_ops:
    - conv
    - dw_pw_conv
    - mbconv
    - skip
    - denoise
    - edge
  conditional_deployment_ops:
    - denoise
    - edge
  paused_ops:
    - mixconv
  dropped_current_target_ops:
    - fused_mbconv

operator_status:
  fused_mbconv_e3_k3:
    search_enabled: false
    deployment_status: dropped_current_target
    screening_status: pilot_timeout
    reason: HLS/downstream pilot did not close reliably under the current AV7K325 target and packed-stream contract.
    revisit_condition: Re-enable only after a dedicated fused architecture rewrite and fresh pilot validation.
  fused_mbconv_e6_k3:
    search_enabled: false
    deployment_status: dropped_current_target
    screening_status: pilot_failed
    reason: Pilot did not yield a stable usable report under the current AV7K325 target and packed-stream contract.
    revisit_condition: Re-enable only after a dedicated fused architecture rewrite and fresh pilot validation.
  mixconv:
    search_enabled: false
    deployment_status: paused
    screening_status: timing_marginal
    achieved_post_route_fmax_mhz: 165.62
    reason: Pilot downstream completed, but post-route timing is materially below the 200 MHz deployment target.
    revisit_condition: Re-enable only if accuracy gain justifies another hardware pass or the template is reworked.
  denoise:
    search_enabled: true
    deployment_status: conditional
    screening_status: timing_below_target
    achieved_post_route_fmax_mhz: 175.04
    reason: Keep in research search space, but treat as not yet deployable at the 200 MHz target.
    hardware_cost_policy:
      metrics_source: vivado_actual.post_route
      latency_rule: use_actual_post_route_fmax
      deployable_at_200mhz: false
  edge:
    search_enabled: true
    deployment_status: conditional
    screening_status: timing_below_target
    achieved_post_route_fmax_mhz: 187.97
    reason: Keep in research search space, but treat as not yet deployable at the 200 MHz target.
    hardware_cost_policy:
      metrics_source: vivado_actual.post_route
      latency_rule: use_actual_post_route_fmax
      deployable_at_200mhz: false
