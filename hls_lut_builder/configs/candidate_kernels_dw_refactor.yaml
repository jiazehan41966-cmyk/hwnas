measurement_contract:
  contract_id: packed_stream_v1
  declaration: LUT data is based on a packed-stream implementation; AXIS width equals
    packed channel block times 8 bits, using multiple tokens when a single channel
    vector would exceed the Vitis HLS AXI bitwidth limit.
  io_style: packed_stream
  input_axis_rule: packed input channels * 8 bits, segmented across multiple tokens
    if needed
  output_axis_rule: packed output channels * 8 bits, segmented across multiple tokens
    if needed
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>
defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  pipeline_ii: 2
  input_parallelism: 1
  output_parallelism: 1
  unroll_factor: 1
  array_partition_factor: 1
clock_profiles:
  main_5ns:
    period_ns: 5.0
implementation_profiles:
