measurement_contract:
  contract_id: packed_stream_v1_pointwise_v21
  declaration: >
    Pointwise v2.1 packed-stream profile with explicit PE x SIMD folding.
    PACK_CH fixes AXIS width, output_parallelism is PE, input_parallelism is
    SIMD, and array_partition_factor must provide at least PACK_CH banks for
    II=1 input unpack plus SIMD banks for compute reads.
  io_style: packed_stream
  input_axis_rule: PACK_CH * bitwidth bits, pixel-major
  output_axis_rule: PACK_CH * bitwidth bits, pixel-major
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  fixed_vector_params: 1
  max_axis_bits: 512
  pack_ch: 16
  ch_block: 16
  tile_order: pixel_major
  stream_order: pixel_major
  dsp_pack: "1"
  pipeline_ii: 2
  target_ii: 2
  input_parallelism: 4
  output_parallelism: 16
  unroll_factor: 1
  array_partition_factor: 16

clock_profiles:
  main_5ns:
    period_ns: 5.0
    target_clock_mhz: 200.0

