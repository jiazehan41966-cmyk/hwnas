  formal_lut_status_json: ../results/v2_fixed_vector/formal_lut_status_v2_fixed_vector.json

measurement_contract:
  contract_id: packed_stream_v1_fixed_vector_v2
  declaration: >
    Fixed-vector packed-stream operator measurement. PACK_CH fixes the physical
    AXIS lane count and CH_BLOCK fixes the tile-local channel window. For the
    channel_major_replay depthwise profile, the input feature stream is replayed
    once per channel block.
  io_style: packed_stream
  input_axis_rule: PACK_CH * bitwidth bits, replayed per channel block for channel_major_replay
  output_axis_rule: PACK_CH * bitwidth bits, channel-block-major output order
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

defaults:
  data_type: ap_int<8>
  accum_type: ap_int<32>
  bitwidth: 8
  fixed_vector_params: 1
  max_axis_bits: 512
  pack_ch: 16
  ch_block: 16
  tile_order: channel_major_replay
  stream_order: channel_major_replay
  dsp_pack: "1"
  pipeline_ii: 2
  target_ii: 2
  input_parallelism: 1
  output_parallelism: 1
  unroll_factor: 1
  array_partition_factor: 1

clock_profiles:
  main_5ns:
    period_ns: 5.0
  relaxed_6p667ns:
    period_ns: 6.667

implementation_profiles:
  p16_cb16_ii1_dsp1:
    pack_ch: 16
    ch_block: 16
    pipeline_ii: 1
    target_ii: 1
    dsp_pack: "1"
  p16_cb16_ii2_dsp1:
    pack_ch: 16
    ch_block: 16
    pipeline_ii: 2
    target_ii: 2
    dsp_pack: "1"
  p16_cb16_ii4_dsp1:
    pack_ch: 16
    ch_block: 16
    pipeline_ii: 4
    target_ii: 4
    dsp_pack: "1"
  p16_cb32_ii2_dsp1:
    pack_ch: 16
    ch_block: 32
    pipeline_ii: 2
    target_ii: 2
    dsp_pack: "1"
  p32_cb32_ii2_dsp1:
    pack_ch: 32
    ch_block: 32
    pipeline_ii: 2
    target_ii: 2
    dsp_pack: "1"
  p32_cb64_ii2_dsp1:
    pack_ch: 32
    ch_block: 64
    pipeline_ii: 2
    target_ii: 2
    dsp_pack: "1"
  p64_cb64_ii1_dsp1:
    pack_ch: 64
    ch_block: 64
    pipeline_ii: 1
    target_ii: 1
    dsp_pack: "1"

representative_shapes:
  dw_ir24_e6_112_c96_s2:
    feature_h: 112
    feature_w: 112
    in_channels: 96
    stride: 2
    expand_ratio: 6
  dw_ir64_e3_28_c96_s2:
    feature_h: 28
    feature_w: 28
    in_channels: 96
    stride: 2
    expand_ratio: 3
  dw_ir24_e3_112_c48_s2:
    feature_h: 112
