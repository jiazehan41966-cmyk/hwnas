    stride: 2
    expand_ratio: 3
  identity_repack_14_64:
    feature_h: 14
    feature_w: 14
    in_channels: 64
    out_channels: 64
    stride: 1

operators:
  identity_repack:
    enabled: true
    template: ../templates/identity_repack.cpp.tmpl
    top_function: identity_repack_kernel
    op_type: identity_repack
    shape_refs:
    - identity_repack_14_64
    implementation_refs:
    - p16_cb16_ii1_dsp1
    - p32_cb32_ii2_dsp1
    - p64_cb64_ii1_dsp1
    clock_profile_refs:
    - main_5ns
    parameters:
      kernel_size: 1
      padding: 0
      tile_order: pixel_major
      stream_order: pixel_major
    op_spec_defaults:
      op: identity_repack
      groups: 1
      expand_ratio: 1
  dw_conv_k3:
    enabled: true
    template: ../templates/dw_conv_fixed_vector.cpp.tmpl
    top_function: dw_conv_k3_kernel
    op_type: dw_conv_k3
    shape_refs:
    - dw_ir24_e6_112_c96_s2
    - dw_ir64_e3_28_c96_s2
    implementation_refs:
    - p16_cb16_ii1_dsp1
    - p16_cb16_ii2_dsp1
    - p32_cb32_ii2_dsp1
    clock_profile_refs:
    - main_5ns
    - relaxed_6p667ns
    parameters:
      kernel_size: 3
      padding: 1
      apply_relu: 1
