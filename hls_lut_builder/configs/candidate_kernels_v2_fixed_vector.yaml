    - p16_cb16_ii4_dsp1
    - p16_cb32_ii2_dsp1
    clock_profile_refs:
    - main_5ns
    - relaxed_6p667ns
    parameters:
      kernel_size: 5
      padding: 2
      apply_relu: 1
    op_spec_defaults:
