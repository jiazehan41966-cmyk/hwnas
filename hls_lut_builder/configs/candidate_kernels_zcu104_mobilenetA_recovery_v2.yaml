  declaration: Fresh ZCU104 recovery measurements for the 13 terminally blocked v1 rows. The v1 evidence remains immutable.
  io_style: segmented_packed_stream
  input_axis_rule: pixel-major channel segments, PACK_CH * 8 bits per token
  output_axis_rule: pixel-major channel segments, PACK_CH * 8 bits per token
  control_interface: AXI-Lite
  parameter_storage: BRAM
  activation_type: ap_int<8>
  weight_type: ap_int<8>
  accumulator_type: ap_int<32>

