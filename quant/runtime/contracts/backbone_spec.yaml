schema_version: 1
name: sonar_architecture_v0_1
status: frozen_declarative_specification
executable_search_config: false
baseline_reference: configs/baseline_sonar_frozen.yaml
evidence: reports/SEARCH_SPACE_EVIDENCE.md
split_policy: official_train_valid_only
test_policy: sealed
architecture_space:
  input: [1, 640, 640]
  num_classes: 2
  stem: {channels: 32, kernel: 3, stride: 2}
  stages:
    - {index: 0, op: conv, channels: 16, stride: 1, depth: 1, kernel: 1}
    - {index: 1, op: mbconv, channels: 24, stride: 2, depth: 1, expansion: 3, kernel_choices: [3, 5]}
    - {index: 2, op: mbconv, channels: 32, stride: 2, depth: 1, expansion: 3, kernel_choices: [3, 5]}
    - {index: 3, op: skip, channels: 32, stride: 1, depth: 1}
    - {index: 4, op: mbconv, channels: 64, stride: 2, depth: 1, expansion: 3, kernel_choices: [3, 5]}
    - {index: 5, op: mbconv, channels: 96, stride: 1, depth: 1, expansion: 3, kernel_choices: [3, 5]}
    - {index: 6, op: mbconv, channels: 160, stride: 2, depth: 1, expansion: 3, kernel_choices: [3, 5]}
    - {index: 7, op: mbconv, channels: 320, stride: 1, depth: 1, expansion: 3, kernel_choices: [3, 5]}
  features:
    P2: {stage: 1, stride: 4, channels: 24, spatial: 160}
    P3: {stage: 3, stride: 8, channels: 32, spatial: 80}
    P4: {stage: 5, stride: 16, channels: 96, spatial: 40}
    P5: {stage: 7, stride: 32, channels: 320, spatial: 20}
  output_combinations:
    - {id: P3_P4_P5, levels: [P3, P4, P5], last_active_stage: 7}
    - {id: P2_P3_P4, levels: [P2, P3, P4], last_active_stage: 5}
    - {id: P2_P3_P4_P5, levels: [P2, P3, P4, P5], last_active_stage: 7}
  inactive_tail: omit_after_last_active_stage
  early_feature_preservation:
    mode: derived_from_output_combination
    expose_stride4: if_and_only_if_P2_selected
    earliest_neck_stage: minimum_selected_feature_stage
    lateral_projection: one_1x1_conv_bn_relu_per_selected_level
  neck: {channels: 96, fusion: fixed_top_down_nearest_add, output_kernel: 3}
  head: {count: derived_from_levels, tower_kernel: 3, anchors_per_location: 3, prediction_channels: 21}
  anchors:
    units: input_pixels
    protocol: preserve_stride_association_copy_P3_to_P2
    P2: [[9.25, 13.5], [12.0, 16.25], [15.0, 16.25]]
    P3: [[9.25, 13.5], [12.0, 16.25], [15.0, 16.25]]
    P4: [[12.62, 20.25], [19.75, 15.25], [15.0, 22.75]]
    P5: [[16.5, 22.38], [21.25, 19.5], [21.25, 27.5]]
    recluster: false
  constraints:
    - selected_features_sorted_unique_in_increasing_stride
    - number_of_heads_equals_number_of_levels_equals_number_of_anchor_groups
    - every_prediction_has_3_times_7_channels
    - kernel_choice_applies_only_to_active_mbconv_depthwise_layer
    - mbconv_padding_equals_kernel_minus_one_divided_by_two
    - expansion_and_channels_and_depth_and_stride_are_fixed
    - skip_is_identity_only_with_equal_channels_and_stride_one
    - adjacent_selected_levels_have_stride_ratio_two
    - inactive_tail_has_no_kernel_variable_or_compute
  unique_architecture_count: 144
fixed_protocol:
  reference: configs/baseline_sonar_frozen.yaml
  architecture_changes_are_not_applied_to_baseline: true
  training_and_evaluation: inherit_frozen_protocol_in_future_candidate_runner
  checkpoint_selection: valid_mAP50_95
  postprocessing: frozen_thresholds_and_max_detections
excluded_from_v0_1:
  - dmdc_conv_sonar
  - cfem_sonar
  - directional_operator
  - frequency_spatial_operator
  - attention
  - kernel_7_or_larger
  - dilation
  - arbitrary_fpn_topology
  - dense_scene_head
  - resolution_search
  - quantization_variable
  - fpga_mapping_variable
future_conditional_interface:
  definition: 'Omega = {(x,q,m) | x in X, q in Q(x), m in M(x,q)}'
  x: architecture_space
  q: undefined_not_searched
  m: undefined_not_searched_dependent_on_x_and_q
fpga_compatibility:
  status: primitive_templates_available_full_detection_parity_unverified
  active_hardware_constraints: null
  historical_budget:
    status: legacy_unverified_budget
    latency_ms: 120
    energy_mj: 375
    power_w: 15
    dsp: 1209
    bram: 700
    lut: 161280
