[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-hwnas"
version = "0.2.0"
description = "Layered elastic72 sonar detection HW-NAS"
requires-python = ">=3.10,<3.14"
dependencies = ["omegaconf==2.3.0", "PyYAML>=6,<7", "numpy>=2,<3", "Pillow>=10,<12", "torch>=2.5,<2.8", "torchvision>=0.20,<0.23", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["experiment"]

[tool.setuptools.packages.find]
where = ["."]
include = ["configs*", "space*", "models*", "train*", "quant*", "hw*", "search*", "scripts*"]

[tool.setuptools.package-data]
"quant.runtime" = ["MIGRATION.json", "contracts/*.json", "contracts/*.yaml"]
"configs" = ["*.yaml"]
"models" = ["MIGRATION.json"]
"search" = ["MIGRATION.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
