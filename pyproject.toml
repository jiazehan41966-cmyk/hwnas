[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hwnas-fpga"
version = "0.1.0"
description = "Hardware-aware neural architecture search for sonar classification on FPGA"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "torch>=2.5,<2.8",
  "torchvision>=0.20,<0.23",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
]
deploy = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pyserial>=3.5,<4",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv_cuda",
  "reference",
  "results",
  "results_archive",
  "outputs",
  "hls_lut_builder/results",
  "hls_lut_builder/board_harness/results",
]
addopts = "-ra"
