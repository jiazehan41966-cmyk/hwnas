version: sonar_joint_v1
space: configs/search_space_sonar_v0_1.yaml
baseline: configs/baseline_sonar_frozen.yaml
search_seed: 42
budgets: [40, 60, 80]
populations: [144, 108, 72]
shortlist: 12
confirmation_seeds: [42, 43, 44]
training:
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0001
  scheduler: none
  amp: false
  workers: 0
  initialization: independent_from_scratch
checkpoint_selection: best_valid_mAP50_95_earliest_tie
quant_profiles: [W8A8, HEAD_W8A16, HEAD_W16A16]
calibration: {split: train, images: 64, augmentation: false}
admission: {absolute_drop: 0.003, relative_drop: 0.20, improved_seeds: 2}
mapping_policies: [reference_low, reference_high, reference_min_latency, reference_min_dsp, reference_min_lut, reference_min_bram]
rejection_audit: one_per_macro_per_stage_to_80_stop_if_above_final_top5
evaluation_split: valid
test_policy: sealed
cost_scope: HLS_CSYNTH_serial_compute_kernel_resources
unknown_cost_policy: needs_measurement_excluded_from_pareto
deployment_claim: false
