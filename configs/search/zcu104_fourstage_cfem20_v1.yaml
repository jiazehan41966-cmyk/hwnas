project:
  name: zcu104-mobilenetA-full-dmdc-cfem-v1
  seed: 42
  output_dir: results/zcu104_mobilenetA_full_dmdc_cfem_v1

dataset:
  name: nksid
  data_dir: data/NKSID
  input_channels: 1
  image_size: 224
  num_classes: 8
  num_workers: 4
  fold: 0
  split_mode: frozen_inner
  inner_val_fraction: 0.15
  image_error_policy: raise

search_space:
  macro_type: mobilenetA_full_dmdc_cfem
  search_space_version: mobilenetA_full_dmdc_cfem_v1
  stem_channels: 32
  stem_stride: 2
  post_stem_downsample_stride: 1
  stage_strides: [1, 2, 2, 1, 2, 1, 2, 1]
  stage_channel_choices: [[16], [24], [32], [32], [64], [96], [160], [320]]
  stage_depth_choices: [[1], [1], [1], [1], [1], [1], [1], [1]]
  kernel_choices: [1, 3, 5]
  expand_choices: [1, 3, 6]
  op_choices: [conv, mbconv, skip, dmdc_conv_sonar, cfem_sonar]
  stage_block_choices:
    - [{op: conv, kernel_size: 1, expand_ratio: 1, stride: 1}]
    -
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 2}
    -
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 2}
    -
      - {op: skip, kernel_size: 1, expand_ratio: 1, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 1}
      - {op: dmdc_conv_sonar, kernel_size: 3, expand_ratio: 1, stride: 1}
      - {op: cfem_sonar, kernel_size: 3, expand_ratio: 1, stride: 1}
    -
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 2}
    -
      - {op: skip, kernel_size: 1, expand_ratio: 1, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 1}
    -
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 2}
    -
      - {op: skip, kernel_size: 1, expand_ratio: 1, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 1}
  head_conv_channels: 1280
  head_channels: null

constraints:
  max_latency_ms: 25.0
  max_energy_mj: 375.0
  max_power_w: 15.0
  max_dsp: 1209
  max_bram: 218
  max_lut: 161280

hardware:
  target: fpga
  board: zcu104_xczu7ev
  quantization_bits: 8
  estimator: zcu104_mobilenetA_full_operator_cost_lut_v1
  lut_path: null
  use_dummy_lut: false
  operator_cost_lut_path: artifacts/zcu104_full_campaign_v1/operator_cost_lut/mobilenetA_full_dmdc_cfem_v2_recovered/hardware_cost_lut.formal.json
  operator_cost_lut_coverage_path: artifacts/zcu104_full_campaign_v1/operator_cost_lut/mobilenetA_full_dmdc_cfem_v2_recovered/coverage_audit.formal.json
  operator_cost_lut_preflight_path: artifacts/zcu104_full_campaign_v1/operator_cost_lut/mobilenetA_full_dmdc_cfem_v2_recovered/preflight.formal.json
  allow_test_operator_cost_data: false

search:
  method: rl
  comparison_scope: rl_only_no_cross_method_claim
  compared_methods: [rl]
  episodes: 20
  num_candidates: 20
  eval_epochs: 10
  eval_early_stopping_patience: 2
  selection_metric: macro_f1
  formal_budget:
    candidate_evaluations: 20
    model_train_epochs_per_evaluation: 10
  objective_weights:
    accuracy: 1.0
    latency: 0.2
    energy: 0.1
    resource: 0.1
  pareto:
    objectives: [macro_f1, latency_ms, energy_mj, dsp, bram, lut]
    directions: [max, min, min, min, min, min]
    selection_method: rank
    topk: 5
  proxyless:
    evaluator_mode: weight_sharing_supernet
    comparison_boundary: not_equal_to_independent_candidate_train_budget

training:
  epochs: 150
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 8
  warmup_epochs: 5
  min_lr_ratio: 0.01
  label_smoothing: 0.1
  logit_adjust_tau: 1.0
  early_stopping_patience: null
  topk: 5
  gradient_accumulation_steps: 4
  amp: true

deployment:
  run_hls_validation: false
  quantization:
    first_stage: ptq
    fallback: qat
  accuracy_retention:
    macro_f1_drop_threshold: 0.02
    top1_drop_threshold: 0.02
    require_fp32_int8_board_layers: true
    require_board_sample_coverage: 1.0
    require_crc_error_count: 0
    require_status_error_count: 0
    require_argmax_mismatch_count: 0
  required_metrics:
    sonar_task: [macro_f1, top1, per_class_f1, confusion_matrix]
    robustness: [clean_macro_f1, noisy_macro_f1, delta_macro_f1, noise_type, noise_strength]
    image_quality_optional_clean_reference_only: [psnr, ssim]
    search_efficiency: [wall_clock_seconds, gpu_reserved_hours, candidates_per_wall_hour]
    pareto_quality: [hypervolume, pareto_front_size]
    model_complexity: [params, flops, macs]
    fpga_performance: [latency_ms, fps, gmac_per_s, gops]
    fpga_resources: [lut, dsp, bram]
    measured_power: [power_w, chip_average_power_w, dynamic_power_w, energy_mj, fps_per_w]
