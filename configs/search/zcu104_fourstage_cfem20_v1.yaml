project:
  name: zcu104-fourstage-cfem20-v1
  seed: 42
  output_dir: results/zcu104_fourstage_cfem20_v1

dataset:
  name: nksid
  data_dir: data/NKSID
  input_channels: 1
  image_size: 224
  num_classes: 8
  num_workers: 4
  fold: 0
  split_mode: frozen_inner
  inner_val_fraction: 0.15
  image_error_policy: raise

search_space:
  macro_type: stage_based
  stem_channels: 32
  stem_stride: 2
  post_stem_downsample_stride: 1
  stage_strides: [1, 2, 2, 1]
  stage_channel_choices: [[16], [24], [32], [32]]
  stage_depth_choices: [[1], [1], [1], [1]]
  kernel_choices: [1, 3, 5]
  expand_choices: [1, 3, 6]
  op_choices: [conv, mbconv, skip, dmdc_conv_sonar, cfem_sonar]
  stage_block_choices:
    - [{op: conv, kernel_size: 1, expand_ratio: 1, stride: 1}]
    -
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 3, expand_ratio: 6, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 2}
      - {op: mbconv, kernel_size: 5, expand_ratio: 6, stride: 2}
    - [{op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 2}]
    -
      - {op: skip, kernel_size: 1, expand_ratio: 1, stride: 1}
      - {op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 1}
      - {op: mbconv, kernel_size: 5, expand_ratio: 3, stride: 1}
      - {op: dmdc_conv_sonar, kernel_size: 3, expand_ratio: 1, stride: 1}
      - {op: cfem_sonar, kernel_size: 3, expand_ratio: 1, stride: 1}
  head_conv_channels: null
  head_channels: null

# Formal deployment budgets remain pending preregistration. Device capacities
# are not used as evidence that a candidate passes deployment gates.
constraints:
  max_latency_ms: null
  max_energy_mj: null
  max_power_w: null
  max_dsp: null
  max_bram: null
  max_lut: null

hardware:
  target: fpga
  board: zcu104_xczu7ev
  quantization_bits: 8
  estimator: zcu104_cfem20_exact_shape_operator_cost_v1
  lut_path: null
  use_dummy_lut: false
  zcu104_operator_cost_path: artifacts/zcu104_full_campaign_v1/operator_cost_lut/fourstage_cfem20_v1/hardware_cost_lut.formal.json
  zcu104_operator_cost_coverage_path: artifacts/zcu104_full_campaign_v1/operator_cost_lut/fourstage_cfem20_v1/coverage_audit.formal.json
  allow_test_operator_cost_data: false

search:
  method: rl
  episodes: 20
  num_candidates: 20
  eval_epochs: 3
  eval_early_stopping_patience: 2
  selection_metric: macro_f1
  objective_weights:
    accuracy: 1.0
    latency: 0.2
    energy: 0.1
    resource: 0.1

training:
  epochs: 150
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 8
  warmup_epochs: 5
  min_lr_ratio: 0.01
  label_smoothing: 0.1
  logit_adjust_tau: 1.0
  early_stopping_patience: null
  topk: 5
  gradient_accumulation_steps: 4
  amp: true

deployment:
  run_hls_validation: false
