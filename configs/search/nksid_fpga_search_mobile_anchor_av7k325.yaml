project:
  name: nksid-fpga-hwnas-mobile-anchor-mobilenet-v2
  seed: 42
  output_dir: results

anchor_source:
  source_run_name: backbone_nksid_av7k325_fair_scratch_seed42_gpu_20260417
  selected_backbone_pool: results/backbone_nksid_av7k325_fair_scratch_seed42_gpu_20260417/results/selected_backbone_pool.json
  source_role: search_anchor
  source_arch_id: mobilenet_v2_scratch
  source_backbone: mobilenet_v2

dataset:
  name: nksid
  data_dir: data/NKSID
  input_channels: 1
  image_size: 224
  num_classes: 8
  fold: 0
  num_workers: 4
  normalization: grayscale
  image_error_policy: raise

search_space:
  family_profile: mobile_anchor
  macro_type: stage_based
  stem_stride: 2
  post_stem_downsample_stride: 1
  stage_strides: [1, 2, 2, 2, 1, 2, 1]
  stem_channels: 24
  stage_base_channels: [8, 12, 16, 16, 20, 24, 24]
  width_multipliers: [0.75, 1.0]
  stage_depth_choices:
    - [1]
    - [1, 2]
    - [1, 2]
    - [2]
    - [1, 2]
    - [1, 2]
    - [1]
  kernel_choices: [3, 5]
  expand_choices: [1, 2]
  op_choices:
    - conv
    - mbconv
    - skip
  head_conv_channels: 320

constraints:
  max_latency_ms: 50.0
  max_power_w: null
  max_model_size_mb: null
  max_dsp: 840
  max_bram: 445
  max_lut: 203800
  max_memory_bandwidth_gbps: 3.0
  max_offchip_mem_mb: 128.0

hardware:
  target: fpga
  board: alinx_av7k325
  quantization_bits: 8
  estimator: analytic_lut_then_hls
  lut_path: null
  use_dummy_lut: false
  operator_manifest_path: hls_lut_builder/configs/operator_manifest_semantic_safe.yaml
  # Scalar calibration v1 is retained as diagnostic evidence only. It mixed
  # post-route resources with COM5 e2e latency and is not a valid hard-screen.
  # Until calibration_v2 and independent probes pass, analytic metrics must
  # pass through to candidate-level HLS evidence instead of rejecting candidates.
  analytic_calibration_path: null

search:
  method: rl
  num_candidates: 20
  eval_epochs: 3
  timeout_minutes: null
  controller_hidden: 64
  controller_lr: 0.01
  episodes: 20
  selection_metric: macro_f1
  pareto:
    selection_method: rank
    topk: 5
  objective_weights:
    accuracy: 1.0
    latency: 0.2
    energy: 0.0
    resource: 0.1

training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  epochs: 100

deployment:
  export_format: onnx
  run_hls_validation: false
