project:
  name: nas-board-lut-strict-current84-arch84-smoke-av7k325
  seed: 42
  output_dir: results
  run_name: nas_board_lut_strict_current84_arch84_smoke

dataset:
  name: dummy
  data_dir: null
  input_channels: 1
  image_size: 224
  num_classes: 8
  fold: 0
  num_workers: 0
  normalization: grayscale

search_space:
  family_profile: null
  macro_type: stage_based
  stem_stride: 2
  post_stem_downsample_stride: 4
  stage_strides: [1]
  stem_channels: 32
  stage_base_channels: [32]
  width_multipliers: [1.0]
  stage_depth_choices:
    - [1]
  kernel_choices: [3]
  expand_choices: [3]
  op_choices:
    - mbconv
  stage_block_choices:
    - [{op: mbconv, kernel_size: 3, expand_ratio: 3, stride: 1}]
  head_conv_channels: null

constraints:
  max_latency_ms: 120.0
  max_power_w: 20.0
  max_model_size_mb: null
  max_dsp: 1200
  max_bram: 600
  max_lut: 200000
  max_memory_bandwidth_gbps: null
  max_offchip_mem_mb: 128.0

hardware:
  target: fpga
  board: alinx_av7k325
  quantization_bits: 8
  max_lut: 1000000
  max_ff: 1000000
  max_bram: 10000
  max_dsp: 10000
  max_power_w: 1000.0
  memory_bandwidth_gbps: 1000.0
  offchip_mem_mb: 10000.0
  estimator: strict_board_lut
  lut_path: hls_lut_builder/results/nas_board_lut_strict_current84_arch84/nas_board_lut_strict.json
  formal_lut_status_path: hls_lut_builder/results/nas_board_lut_strict_current84_arch84/nas_board_lut_status.json
  strict_formal_lut: true
  strict_lut_label: strict board LUT
  use_lut_for_head_layers: true
  lut_allow_shape_only_match: false
  lut_enable_interpolation: false
  use_dummy_lut: false

search:
  method: rl
  num_candidates: 1
  episodes: 1
  eval_epochs: 1
  eval_early_stopping_patience: 1
  timeout_minutes: null
  controller_hidden: 32
  controller_lr: 0.01
  selection_metric: macro_f1
  pareto:
    selection_method: rank
    topk: 1
  objective_weights:
    accuracy: 1.0
    latency: 0.2
    energy: 0.1
    resource: 0.1

training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 4
  epochs: 1

deployment:
  export_format: onnx
  run_hls_validation: false
