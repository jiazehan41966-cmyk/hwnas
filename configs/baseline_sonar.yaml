detection:
  input_size: 640
  feature_stage_indices:
  - 3
  - 5
  - 7
  feature_strides:
  - 8
  - 16
  - 32
  fixed_neck:
    type: fpn
    searchable: false
    out_channels: 96
  fixed_head:
    type: dense_anchor_head
    searchable: false
    anchors_per_location: 3
    outputs_per_anchor: 7
  anchor_sizes:
  - - - 9.25
      - 13.5
    - - 12.0
      - 16.25
    - - 15.0
      - 16.25
