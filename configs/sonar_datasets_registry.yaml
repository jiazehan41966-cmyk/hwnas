schema_version: phase3a-sonar-datasets-registry-v1
path_base: repository_root
test_policy: sealed_no_model_or_evidence_access
analysis_defaults:
  split: train
  input_size: 640
  contrast_ring_alpha: 2.0
  contrast_epsilon: 1.0e-6
  frequency_edges: [0.3333333333333333, 0.6666666666666666]
  edge_gradient_threshold: 0.12
  coco_small_area_px2: 1024
  coco_medium_area_px2: 9216
  high_aspect_ratio_upper: 2.0
  high_aspect_ratio_lower: 0.5
  dense_scene_objects: 3
  seed: 42

datasets:
  - dataset_id: cylinder2_v6_dataset_a
    dataset_name: Roboflow Cylinder2 v6 official YOLOv8 export
    modality: UNKNOWN
    modality_evidence: Source metadata does not explicitly identify FLS, SSS, or SAS.
    root: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8
    train_images: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/train/images
    train_labels: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/train/labels
    valid_images: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/valid/images
    valid_labels: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/valid/labels
    test_images: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/test/images
    test_labels: data/external_redownload_audit_20260909/roboflow_cylider2/extracted/v6_yolov8/test/labels
    annotation_format: yolo_axis_aligned_bbox
    classes: [cylider, manta]
    channels: 3
    model_input_channels: 1
    native_resolution: 1280x1280
    license: CC BY 4.0
    source_url: https://universe.roboflow.com/yeesonmin-naver-com/cylider2/dataset/6
    source_manifest: data/external_redownload_audit_20260909/roboflow_cylider2/dataset_manifest.json
    acquisition_group_key: weak_filename_date_experiment_prefix
    split_policy: official_roboflow_v6
    orientation_label_available: false
    mask_available: false
    sequence_information_available: weak_filename_only
    analysis_enabled: true
    notes: Dataset A; modality intentionally UNKNOWN. Train-only evidence must not read validation or test pixels.

  - dataset_id: uatd_v3
    dataset_name: Underwater Acoustic Target Detection Dataset v3
    modality: MFLS
    modality_evidence: Official paper metadata identifies multibeam forward-looking sonar and Tritech Gemini 1200ik.
    root: datasets/UATD/processed_yolo
    train_images: datasets/UATD/processed_yolo/train/images
    train_labels: datasets/UATD/processed_yolo/train/labels
    valid_images: null
    valid_labels: null
    test_images: datasets/UATD/processed_yolo/test/images
    test_labels: datasets/UATD/processed_yolo/test/labels
    annotation_format: yolo_axis_aligned_bbox_converted_from_pascal_voc
    classes: [ball, circle cage, cube, cylinder, human body, metal bucket, plane, rov, square cage, tyre]
    channels: 3
    model_input_channels: 1
    native_resolution: variable_512_or_1024_width_1024_to_2047_height
    license: CC BY 4.0
    source_url: https://figshare.com/articles/dataset/UATD_Dataset/21331143
    source_manifest: datasets/UATD/metadata/dataset_manifest.json
    acquisition_group_key: null
    split_policy: official_train_test1_test2_no_validation
    orientation_label_available: false
    mask_available: false
    sequence_information_available: false
    analysis_enabled: true
    notes: Official source has 7600 train and two test archives but no validation split; no derived validation is created in Phase 3A.

  - dataset_id: classic_sctd_1_0
    dataset_name: Sonar Common Target Detection Dataset 1.0
    modality: SSS
    modality_evidence: Dataset card records side-scan sonar based on published descriptions; source package itself lacks mission metadata.
    root: datasets/SCTD/processed
    train_images: datasets/SCTD/processed/train/images
    train_labels: datasets/SCTD/processed/train/labels
    valid_images: datasets/SCTD/processed/valid/images
    valid_labels: datasets/SCTD/processed/valid/labels
    test_images: datasets/SCTD/processed/test/images
    test_labels: datasets/SCTD/processed/test/labels
    annotation_format: yolo_axis_aligned_bbox_converted_from_pascal_voc
    classes: [aircraft, human, ship]
    channels: 3
    model_input_channels: 1
    native_resolution: variable
    license: UNKNOWN
    source_url: https://github.com/MingqiangNing/SCTD
    source_manifest: datasets/SCTD/metadata/dataset_manifest.json
    acquisition_group_key: project_numeric_run_group_heuristic
    split_policy: project_derived_numeric_run_group_split_v1
    orientation_label_available: false
    mask_available: false
    sequence_information_available: weak_numeric_filename_runs
    analysis_enabled: true
    notes: Official package exposes trainval only; project train/valid/test split is group-aware by consecutive numeric runs but mission independence is unproven.

  - dataset_id: figshare_mine_detection_v2
    dataset_name: Side-scan sonar imaging for Mine detection v2
    modality: SSS
    modality_evidence: Official Figshare title and description explicitly identify side-scan sonar.
    root: data/external/figshare_mine_detection_v2/extracted
    train_images: null
    train_labels: null
    valid_images: null
    valid_labels: null
    test_images: null
    test_labels: null
    annotation_format: yolo_axis_aligned_bbox_by_acquisition_year
    classes: [MILCO, NOMBO]
    channels: 3
    model_input_channels: 1
    native_resolution: variable
    license: CC BY 4.0
    source_url: https://figshare.com/articles/dataset/24574879
    source_manifest: data/external/figshare_mine_detection_v2/dataset_manifest.json
    acquisition_group_key: acquisition_year
    split_policy: no_registered_train_valid_test_split
    orientation_label_available: false
    mask_available: true
    sequence_information_available: acquisition_year_only
    analysis_enabled: false
    notes: Registered but excluded from Phase 3A statistics because no source-defined or reviewed development split is frozen.
