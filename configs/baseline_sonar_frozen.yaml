    - - 21.25
      - 27.5
  metrics:
    primary: mAP50_95
    secondary:
    - AP50
    - AP75
    - Precision
    - Recall
    source: evaluation_protocol
constraints:
  max_latency_ms: 120.0
  max_energy_mj: 375.0
  max_power_w: 15.0
  max_dsp: 1209
  max_bram: 700
  max_lut: 161280
  budget_note: copied hardware-aware search constraints; detection head cost is fixed
    in stage 1
training:
  epochs: 80
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 4
  amp: false
  detection_loss:
    type: dense_anchor_yolo_style_v1
    box_weight: 5.0
    box_iou_weight: 1.0
    object_weight: 1.0
    no_object_weight: 0.1
    class_weight: 2.0
    class_loss_weights:
    - 1.0
    - 1.0
    positive_anchor_iou_threshold: 0.65
    ignore_anchor_iou_threshold: 0.35
    neighbor_cell_radius: 1
    object_focal_gamma: 2.0
    object_focal_alpha: 0.75
    objectness_normalization: fixed_weights
    box_iou_loss_type: iou
  detection_augmentation:
    horizontal_flip_prob: 0.5
    brightness: 0.1
    contrast: 0.1
    noise_std: 0.01
  detection_sampling:
    class_balanced: true
  evaluation:
    source: evaluation_protocol is authoritative in tools/sonar_analysis/baseline.py;
      no threshold sweep
  scheduler: none
  optimizer_defaults:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    amsgrad: false
  sampler_protocol:
    type: WeightedRandomSampler
    replacement: true
    num_samples: 330
    weight: max inverse class-image frequency per image
    seed: 42
  early_stopping: false
baseline_freeze:
  status: PROTOCOL_FROZEN
  source: configs/baseline_sonar.yaml
  manifest: reports/baseline_sonar_frozen/freeze_manifest.json
  effective_entry: tools/sonar_analysis/baseline.py
  effective_values: model/training/metric values from YAML only; workers and device
    are recorded CLI resource overrides
  sanity_override:
    epochs: 1
    train_batches: 2
    valid_batches: 2
    batch_size: 4
    formal_metrics: false
  historical_corrections:
  - epochs80 matches existing controlled command; source historical YAML150 is not
    used
  - 'AMP false: no autocast or GradScaler'
  - 'scheduler none: no step or LR schedule'
  no_architecture_changes: true
evaluation_protocol:
  id: sonar_baseline_valid_coco_v1
  development_splits:
  - train
  - valid
  test_policy: 'sealed: no test performance in this wrapper'
  checkpoint_selection_metric: valid mAP50_95
  checkpoint_tie_break: earliest epoch
  iou_thresholds:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  interpolation: 101-point recall, monotone precision envelope
  class_averaging: unweighted mean over classes with GT in the evaluated split
  coordinate_space: 640x640 square network input pixels
  ap_decode_score_threshold: 0.0
  precision_recall_score_threshold: 0.5
  precision_recall_iou: 0.5
  precision_recall_averaging: micro; includes FP for classes without GT
  nms_iou_threshold: 0.5
  pre_nms_topk: 500
  post_nms_max_detections_per_image: 100
  max_detections_per_image_per_class: 100
  differences_from_pycocotools:
  - bbox-only; no crowd/ignore support; active labels have neither
  - finite pre-NMS top500 and global post-NMS top100 before evaluator
  - same-score ordering may differ; no official COCO area metrics claimed
  - custom evaluator all-area AP; parity tests against pycocotools on non-crowd fixtures
  historical_metrics: old AP50/AP75 mean and old .01 score/50 detection cap left unchanged
    in historical scripts; no cross-protocol direct comparison
