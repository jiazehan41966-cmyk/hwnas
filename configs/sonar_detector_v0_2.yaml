schema_version: 2
name: sonar_detector_v0_2_prototypes
status: executable_software_prototype_contract_not_trained_not_board_measured
preserve_v0_1: true
executable_prototype_config: true
executable_search_config: false
architecture_space:
  input: [1, 640, 640]
  num_classes: 2
  stem: {channels: 32, kernel: 3, stride: 2}
  stages:
    - {index: 0, op: conv, channels: 16, stride: 1, depth: 1, kernel: 1}
    - {index: 1, op: mbconv, channels: 24, stride: 2, depth: 1, expansion: 3, kernel: 3}
    - {index: 2, op: mbconv, channels: 32, stride: 2, depth: 1, expansion: 3, kernel: 3}
    - {index: 3, op: skip, channels: 32, stride: 1, depth: 1, kernel: 1}
    - {index: 4, op: mbconv, channels: 64, stride: 2, depth: 1, expansion: 3, kernel: 3}
    - {index: 5, op: mbconv, channels: 96, stride: 1, depth: 1, expansion: 3, kernel: 3}
    - {index: 6, op: mbconv, channels: 160, stride: 2, depth: 1, expansion: 3, kernel: 3}
    - {index: 7, op: mbconv, channels: 320, stride: 1, depth: 1, expansion: 3, kernel: 3}
  features:
    P2: {stage: 1, stride: 4, channels: 24, spatial: 160}
    P3: {stage: 3, stride: 8, channels: 32, spatial: 80}
    P4: {stage: 5, stride: 16, channels: 96, spatial: 40}
    P5: {stage: 7, stride: 32, channels: 320, spatial: 20}
  inactive_tail: omit_after_last_active_stage
  neck:
    lateral: conv1_bn_relu_per_level
    fusion: fixed_top_down_nearest_add
    top_down_source: fused_before_output_smoothing
    smoothing: dw3_bn_relu_then_pw1_bn_relu_per_level
  head:
    prediction_kernel: 1
    prediction_bias: true
    prediction_activation: linear
    anchors_per_location: 3
    prediction_channels: 21
    objectness_bias_prior: 0.01
    class_bias: 0.0
  anchors:
    units: input_pixels
    protocol: preserve_stride_association_copy_P3_to_P2
    P2: [[9.25, 13.5], [12.0, 16.25], [15.0, 16.25]]
    P3: [[9.25, 13.5], [12.0, 16.25], [15.0, 16.25]]
    P4: [[12.62, 20.25], [19.75, 15.25], [15.0, 22.75]]
    P5: [[16.5, 22.38], [21.25, 19.5], [21.25, 27.5]]
    recluster: false
  prototypes:
    R0: {name: R0_P234_U32_direct, levels: [P2, P3, P4], last_active_stage: 5, neck_channels: 32, extra_DS_tower_blocks: 0}
    R1: {name: R1_P234_U48_direct, levels: [P2, P3, P4], last_active_stage: 5, neck_channels: 48, extra_DS_tower_blocks: 0}
    R7: {name: R7_P2345_U48_direct, levels: [P2, P3, P4, P5], last_active_stage: 7, neck_channels: 48, extra_DS_tower_blocks: 0}
    R8: {name: R8_P234_U48_extraDS, levels: [P2, P3, P4], last_active_stage: 5, neck_channels: 48, extra_DS_tower_blocks: 1}
fixed_protocol:
  reference: configs/baseline_sonar_frozen.yaml
  split_policy: official_train_valid_only
  test_policy: sealed
  checkpoint_selection: valid_mAP50_95
  postprocessing: frozen_thresholds_and_max_detections
  repeated_P2_P3_anchor_tie: preserve_first_level_and_report
