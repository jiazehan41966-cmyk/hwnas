    license_spdx:
    license_state: missing
    official_code: true
    execution_role: isolated_archive_audit_then_nksid_adapter
    numerical_comparison_rule: local_frozen_nksid_protocol_only
    paper_code_correspondence: partial
    correspondence_note: >-
      The pinned archive contains dmcl.py, but its top-level README documents the
