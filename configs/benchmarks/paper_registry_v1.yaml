schema_version: 1
papers:
  - paper_id: hw_pr_nas_2023
    title: Multi-objective Hardware-Aware Neural Architecture Search with Pareto Rank-preserving Surrogate Models
    year: 2023
    venue: ACM TACO (CCF A)
    direction: nas_pareto_surrogate
    comparability_class: B
    paper_url: https://doi.org/10.1145/3579853
    repo_url: https://github.com/IHIaadj/HW-PR-NAS
    checkout_path: reference/HW-PR-NAS
    pinned_commit: 296c6576fbae2b277e56c704ff3b6e648ec4c2be
    license_spdx: MIT
    license_state: verified
    official_code: true
    execution_role: local_search_space_adapter
    numerical_comparison_rule: local_unified_protocol_only
    paper_code_correspondence: partial
    correspondence_note: >-
      The pinned official repository compiles individual source files but is not
      an executable release of the paper method. README-listed files
      surrogate_models/base_surrogate.py, accuracy_predictor.py,
      latency_predictor.py, and energy_predictor.py are absent; search_algo.py
      calls an undefined valid_loss(), and test.py invokes evolution_search with
      an incompatible argument. Any local implementation of the listwise Pareto
      ranking loss must be labelled paper-spec reimplementation, not author code.
    smoke:
      mode: source_completeness_audit
      files: [compute_metrics.py, search_algo.py, test.py]
      expected_files:
        - surrogate_models/base_surrogate.py
        - surrogate_models/accuracy_predictor.py
        - surrogate_models/latency_predictor.py
        - surrogate_models/energy_predictor.py

